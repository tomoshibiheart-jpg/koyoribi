<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="こよりヴィレッジの構想イメージ：畑と家とマーケットのある小さな村">
  <defs>
    <linearGradient id="vSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F0DC"/><stop offset="70%" stop-color="#FAF7F0"/>
    </linearGradient>
    <radialGradient id="vSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6E3AE" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#EBDCA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vHill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C6D7AE"/><stop offset="100%" stop-color="#DCE5C6"/>
    </linearGradient>
    <linearGradient id="vHill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A2BC88"/><stop offset="100%" stop-color="#BFD2A6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#vSky)"/>
  <circle cx="640" cy="120" r="120" fill="url(#vSun)"/>
  <circle cx="640" cy="120" r="34" fill="#F0DEA4"/>

  <!-- 遠景の丘 -->
  <path d="M0 250 C 120 212, 230 236, 330 212 C 450 184, 560 214, 800 180 L800 600 L0 600 Z" fill="url(#vHill2)" opacity=".85"/>
  <path d="M0 300 C 150 272, 300 304, 440 278 C 600 250, 700 282, 800 266 L800 600 L0 600 Z" fill="url(#vHill1)"/>

  <!-- 道 -->
  <path d="M400 600 C 390 500, 440 440, 420 384 C 404 340, 452 316, 470 300"
        fill="none" stroke="#E6DCC0" stroke-width="40" stroke-linecap="round"/>
  <path d="M400 600 C 390 500, 440 440, 420 384 C 404 340, 452 316, 470 300"
        fill="none" stroke="#D5C7A2" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round"/>

  <!-- 畑 -->
  <g stroke="#89A471" stroke-width="3.4" stroke-linecap="round">
    <path d="M78 400 h130"/><path d="M70 420 h146"/><path d="M62 440 h162"/><path d="M56 460 h174"/>
  </g>
  <g fill="#8CA87A">
    <circle cx="96" cy="400" r="5"/><circle cx="140" cy="400" r="5"/><circle cx="184" cy="400" r="5"/>
    <circle cx="86" cy="420" r="5"/><circle cx="134" cy="420" r="5"/><circle cx="186" cy="420" r="5"/>
    <circle cx="78" cy="440" r="5"/><circle cx="130" cy="440" r="5"/><circle cx="190" cy="440" r="5"/>
  </g>

  <!-- 中央の家(大) -->
  <g>
    <path d="M398 268 L486 330 L486 420 L310 420 L310 330 Z" fill="#FDFBF5" stroke="#A8865A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M398 258 L504 334 L492 348 L398 282 L304 348 L292 334 Z" fill="#C7A878" stroke="#A8865A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="378" y="366" width="40" height="54" rx="4" fill="#D8BC90" stroke="#A8865A" stroke-width="2.5"/>
    <rect x="326" y="352" width="34" height="30" rx="4" fill="#E7D9A8" stroke="#A8865A" stroke-width="2.5"/>
    <rect x="436" y="352" width="34" height="30" rx="4" fill="#E7D9A8" stroke="#A8865A" stroke-width="2.5"/>
    <rect x="452" y="282" width="18" height="34" rx="3" fill="#B6997A" stroke="#A8865A" stroke-width="2.5"/>
  </g>

  <!-- 左の家 -->
  <g>
    <path d="M198 322 L262 366 L262 424 L134 424 L134 366 Z" fill="#FDFBF5" stroke="#A8865A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M198 314 L276 368 L266 380 L198 332 L130 380 L120 368 Z" fill="#B7CBA2" stroke="#8CA87A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="184" y="386" width="28" height="38" rx="3" fill="#D8BC90" stroke="#A8865A" stroke-width="2"/>
  </g>

  <!-- 右の家 -->
  <g>
    <path d="M612 332 L676 374 L676 428 L548 428 L548 374 Z" fill="#FDFBF5" stroke="#A8865A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M612 324 L690 376 L680 388 L612 342 L544 388 L534 376 Z" fill="#C7A878" stroke="#A8865A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="566" y="390" width="30" height="26" rx="3" fill="#E7D9A8" stroke="#A8865A" stroke-width="2"/>
    <rect x="626" y="390" width="30" height="26" rx="3" fill="#E7D9A8" stroke="#A8865A" stroke-width="2"/>
  </g>

  <!-- マーケットの屋台 -->
  <g>
    <path d="M268 470 h150 v12 h-150 z" fill="#D8BC90" stroke="#A8865A" stroke-width="2.5"/>
    <path d="M276 482 v52 M410 482 v52" stroke="#A8865A" stroke-width="3" stroke-linecap="round"/>
    <path d="M262 470 q22 -34 44 0 q22 -34 44 0 q22 -34 44 0 q22 -34 24 0 z" fill="#E3CE8C" stroke="#A8865A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="292" y="498" width="110" height="36" rx="5" fill="#FBF7EC" stroke="#C3A86C" stroke-width="2"/>
    <circle cx="312" cy="516" r="7" fill="#DCA978"/><circle cx="334" cy="516" r="7" fill="#A4B596"/>
    <circle cx="356" cy="516" r="7" fill="#C9A05E"/><circle cx="378" cy="516" r="7" fill="#B98C8C"/>
  </g>

  <!-- 木 -->
  <g>
    <path d="M94 520 v-46" stroke="#8C7A63" stroke-width="7" stroke-linecap="round"/>
    <circle cx="94" cy="462" r="36" fill="#9DB587"/><circle cx="70" cy="478" r="24" fill="#B7CBA2"/><circle cx="118" cy="476" r="26" fill="#879F74"/>
    <path d="M722 536 v-54" stroke="#8C7A63" stroke-width="8" stroke-linecap="round"/>
    <circle cx="722" cy="466" r="42" fill="#9DB587"/><circle cx="692" cy="486" r="28" fill="#B7CBA2"/><circle cx="752" cy="484" r="30" fill="#879F74"/>
    <path d="M514 452 v-30" stroke="#8C7A63" stroke-width="5" stroke-linecap="round"/>
    <circle cx="514" cy="412" r="24" fill="#AFC697"/>
  </g>

  <!-- 人 -->
  <g>
    <path d="M423 548 C423 493 473 493 473 548 Z" fill="#8C9BAE"/>
    <circle cx="448" cy="492" r="16" fill="#C08C7A"/>
    <path d="M463 552 C463 503 509 503 509 552 Z" fill="#A4B596"/>
    <circle cx="486" cy="502" r="15" fill="#D0B087"/>
    <path d="M213 558 C213 509 259 509 259 558 Z" fill="#C9A05E"/>
    <circle cx="236" cy="508" r="15" fill="#B98C8C"/>
    <path d="M574 516 C574 469 618 469 618 516 Z" fill="#9A8CA8"/>
    <circle cx="596" cy="468" r="14" fill="#A8866E"/>
    <path d="M606 520 C606 477 646 477 646 520 Z" fill="#7E9AA6"/>
    <circle cx="626" cy="476" r="13" fill="#C9A05E"/>
  </g>

  <!-- 手前の草 -->
  <g stroke="#8CA87A" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M40 580 q6 -22 14 -30"/><path d="M58 582 q4 -18 12 -26"/>
    <path d="M760 574 q-6 -22 -14 -30"/><path d="M742 578 q-4 -18 -12 -26"/>
  </g>
</svg>
